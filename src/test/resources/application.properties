# Test environment config - H2 in-memory DB use karta hai
# Real Supabase/PostgreSQL se connect nahi karta, isliye tests fast aur independent hain

# H2 In-Memory Database (test ke liye)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - test mein create-drop use karo (Flyway nahi)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Flyway test mein disable karo (H2 ke saath PostgreSQL specific SQL ka issue hoga)
spring.flyway.enabled=false

google.client-id=test-client-id
