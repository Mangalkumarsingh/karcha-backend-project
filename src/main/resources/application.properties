# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=demo

# Import local credentials if present (this file is ignored by Git and never uploaded)
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties,optional:file:.env

# Local: 8080
# Render: Uses the PORT environment variable
server.port=${PORT:8080}
server.address=0.0.0.0

# ==========================================
# GOOGLE AUTHENTICATION
# ==========================================
google.client-id=${GOOGLE_WEB_CLIENT_ID:dummy-google-client-id}

# ==========================================
# SUPABASE POSTGRESQL DATABASE
# If DB_URL environment variable is set (e.g. on Render), it will be used.
# Otherwise, it falls back to application-local.properties.
# ==========================================
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# JPA & HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false

# For now, preserve your existing schema behavior.
# For production, use validate after Flyway migrations
# fully match the database schema.
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# FLYWAY MIGRATIONS
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================
# ERROR HANDLING
# ==========================================
server.error.include-message=never
server.error.include-stacktrace=never
